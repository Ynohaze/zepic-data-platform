name: zepic_warehouse
version: 1.0.0
config-version: 2
require-dbt-version: [">=1.12.0", "<1.13.0"]

profile: zepic_warehouse

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages", "logs"]

models:
  zepic_warehouse:
    staging:
      +materialized: view
      +schema: zepic_staging
    marts:
      +materialized: table
      +schema: zepic_analytics
