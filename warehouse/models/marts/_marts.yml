version: 2

models:
  - name: dim_customers
    description: Current customer dimension from the latest validated raw versions.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: dim_products
    description: Current product dimension. Prices are catalog prices; order-line facts retain historical transaction prices.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: sku
        data_tests: [unique, not_null]

  - name: dim_machines
    description: Current machine dimension.
    columns:
      - name: machine_id
        data_tests: [unique, not_null]

  - name: fct_order_lines
    description: Order-line grain fact using the price captured when the order was created and the order's current status.
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

  - name: fct_orders
    description: One row per current valid order. pending_at is the known creation event; later milestones are populated only when that status was captured by extraction.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pending, confirmed, shipped]
      - name: line_count
        data_tests: [not_null]
      - name: unit_count
        data_tests: [not_null]
      - name: pending_at
        data_tests: [not_null]
      - name: lifecycle_fully_observed
        description: True only when raw history contains pending, confirmed, and shipped versions. False does not mean the business event did not happen.
        data_tests: [not_null]

  - name: fct_production_runs
    description: One row per production run, enriched with the linked plan and calculated duration and quantity variance.
    columns:
      - name: production_run_id
        data_tests: [unique, not_null]
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: machine_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_machines')
                field: machine_id

  - name: fct_maintenance
    description: One row per maintenance record. The table can be empty before maintenance simulation is introduced.
    columns:
      - name: maintenance_record_id
        data_tests: [unique, not_null]

  - name: current_inventory
    description: Current inventory balance and catalog-price retail valuation; not an inventory history fact.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: available_quantity
        data_tests: [not_null]
