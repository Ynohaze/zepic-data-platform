version: 2

sources:
  - name: zepic_raw
    description: Append-only Phase 2 records and the Phase 3 quality results that determine Silver eligibility.
    schema: zepic_raw
    tables:
      - name: records
        description: Every raw source version. Current-state selection ranks these rows before applying validity so a newer quarantined version cannot expose an older value.
        columns:
          - name: batch_id
            data_tests: [not_null]
          - name: source_table
            data_tests: [not_null]
          - name: source_primary_key
            data_tests: [not_null]
          - name: source_updated_at
            data_tests: [not_null]
          - name: payload
            data_tests: [not_null]

      - name: quality_runs
        description: Completed validation runs. Raw batches without a quality run are not eligible for Silver.
        columns:
          - name: batch_id
            data_tests: [not_null]
          - name: rule_version
            data_tests: [not_null]

      - name: validated_records
        description: Raw versions that passed the latest completed ruleset for their extraction batch.
        columns:
          - name: batch_id
            data_tests: [not_null]
          - name: source_table
            data_tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [customers, products, machines, inventory, orders, order_items, production_orders, production_runs, maintenance_records]
          - name: source_primary_key
            data_tests: [not_null]
          - name: source_updated_at
            data_tests: [not_null]
          - name: payload
            data_tests: [not_null]
